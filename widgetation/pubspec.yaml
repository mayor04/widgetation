name: widgetation
description: Visual feedback for AI coding agents. Click any widget in your Flutter app, add a note, and paste structured context into Claude Code, Codex, or any AI tool.
version: 0.2.0
repository: https://github.com/mayor04/widgetation
issue_tracker: https://github.com/mayor04/widgetation/issues

topics:
  - devtools
  - debugging
  - inspector
  - widget-tree

environment:
  sdk: ^3.11.1
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

